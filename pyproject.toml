[project]
name = "score-rec"
version = "0.1.0"
description = "Separate a mix and transcribe drums and pitched instruments"
requires-python = ">=3.10"
# Guitar and piano use basic-pitch's ONNX model. On Python 3.11+ its package
# metadata still requires an old TensorFlow, so install it with:
# pip install basic-pitch==0.4.0 --no-deps
dependencies = [
    "audio-separator>=0.39.1",
    "onnxruntime>=1.17",
    "imageio-ffmpeg>=0.5",
    "audioread>=3",
    "librosa>=0.10",
    "mido>=1.3",
    "mir-eval>=0.6",
    "numpy",
    "pretty-midi>=0.2.9",
    "resampy>=0.2.2",
    "soundfile",
]

[project.scripts]
score-rec = "score_rec.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["score_rec*"]
