[project]
name = "score-rec"
version = "0.1.0"
description = "Transcribe drums from a mixed music file"
requires-python = ">=3.10"
dependencies = [
    "audio-separator>=0.39.1",
    "onnxruntime>=1.17",
    "imageio-ffmpeg>=0.5",
    "audioread>=3",
    "librosa>=0.10",
    "mido>=1.3",
    "numpy",
    "soundfile",
]

[project.scripts]
score-rec = "score_rec.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["score_rec*"]
